<style>
/* Jotak 360 Running — tokens */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F6F8FB; --ink:#0E1726; --muted:#5A6577; --line:#DCE2EA;
  --accent:#FF5A1F; --accent-2:#FF8A3D; --accent-ink:#FFFFFF; --navy:#0E1726; --navy-2:#1B2A44;
  --good:#16915A; --warn:#C27008; --bad:#D43B2F;
  --t-leve:#2F7DD1; --t-quali:#FF5A1F; --t-ritmo:#9B51E0; --t-long:#0E8F7E; --t-reg:#7D8797; --t-prova:#D4A017;
  --shadow:0 1px 2px rgba(14,23,38,.06),0 8px 24px rgba(14,23,38,.06);
  --r:14px; --gut:16px;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A0F17; --surface:#131B27; --surface-2:#1A2432; --ink:#EDF1F7; --muted:#95A1B3; --line:#263245;
    --accent:#FF6A2E; --accent-2:#FF9451; --navy:#060A10; --navy-2:#162235;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0F17; --surface:#131B27; --surface-2:#1A2432; --ink:#EDF1F7; --muted:#95A1B3; --line:#263245;
  --accent:#FF6A2E; --accent-2:#FF9451; --navy:#060A10; --navy-2:#162235;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:2rem} h2{font-size:1.5rem} h3{font-size:1.15rem}
.num,.stat b,.stat-xl b{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- logo ---------- */
.logo-lockup{display:flex;align-items:center;gap:12px}
.logo-mark{width:44px;height:44px;border-radius:50%;flex:none;position:relative;
  background:conic-gradient(from 200deg,var(--accent) 0 290deg,transparent 290deg 360deg);
  -webkit-mask:radial-gradient(circle,transparent 52%,#000 53%);mask:radial-gradient(circle,transparent 52%,#000 53%)}
.logo-word{font:800 1.9rem/1 var(--f-display);letter-spacing:.04em}
.logo-word b{color:var(--accent);font-style:italic}
.logo-sub{font:700 .85rem/1 var(--f-display);letter-spacing:.42em;opacity:.75;margin-top:3px}
.logo-lockup.sm .logo-mark{width:28px;height:28px}
.logo-lockup.sm .logo-word{font-size:1.35rem}

/* ---------- auth ---------- */
.auth{min-height:100%;display:flex;flex-direction:column;background:var(--navy);color:#fff;padding-inline:var(--gut);padding-block:max(28px,env(safe-area-inset-top)) 24px}
.auth-hero{max-width:460px;width:100%;margin:0 auto;padding-block:28px 22px;position:relative}
.auth-hero::after{content:"";position:absolute;right:-10px;top:4px;width:150px;height:150px;border-radius:50%;
  border:14px solid rgba(255,90,31,.14);border-right-color:transparent;transform:rotate(-30deg);pointer-events:none}
.auth-tag{color:#B9C4D6;max-width:32ch;margin:16px 0 0;font-size:1.02rem}
.auth-card{background:var(--surface);color:var(--ink);border-radius:20px;padding:18px;max-width:460px;width:100%;margin:0 auto;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.auth-foot{text-align:center;color:#8C99AD;font-size:.85rem;margin-top:16px}

/* ---------- forms ---------- */
.form{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;min-width:0;border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:11px 12px;font-size:1rem}
.fld input:focus,.fld select:focus{border-color:var(--accent);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.form-err{color:var(--bad);font-size:.9rem;margin:0}
.check{display:flex;gap:8px;align-items:center;font-size:.95rem}
.check input{width:18px;height:18px;accent-color:var(--accent)}

.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg-btn{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;color:var(--muted)}
.seg-btn.is-on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.sm{padding:8px 12px;font-size:.9rem}
.btn-block{width:100%}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-dark{background:var(--navy-2);color:#fff}
.btn-ghost{background:var(--surface-2);color:var(--ink);border:1.5px solid var(--line)}
.btn-danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.88rem;padding:6px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.95rem}
.chip.is-on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.big{font:700 1.35rem/1 var(--f-display);padding:12px 18px;letter-spacing:.02em}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days .chip{padding:10px 0;text-align:center;font-size:.85rem}

/* ---------- shell ---------- */
.app{min-height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;
  padding-inline:var(--gut);padding-block:calc(10px + env(safe-area-inset-top,0px)) 10px;background:var(--navy);color:#fff}
.avatar{display:grid;place-items:center;padding:0;width:38px;height:38px;border-radius:50%;border:2px solid var(--accent);background:var(--navy-2);color:#fff;font:700 1rem var(--f-display);letter-spacing:.04em}
.views{flex:1;width:100%;max-width:720px;margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.view{padding-inline:var(--gut);padding-block:18px 8px;display:flex;flex-direction:column;gap:16px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{background:none;border:0;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:.72rem;font-weight:600}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.is-on{color:var(--accent)}
.tabbar .tab-run svg{background:var(--accent);color:#fff;border-radius:50%;width:44px;height:44px;padding:9px;margin-top:-20px;box-shadow:0 6px 16px rgba(255,90,31,.45)}
.tabbar .tab-run.is-on{color:var(--accent)}
.app.running .tabbar{display:none}
.app.running .views{padding-bottom:0}

/* ---------- cards ---------- */
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.eyebrow{font:700 .72rem/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.empty{text-align:center;color:var(--muted);padding:18px 8px}

.hello h1{font-size:2.1rem}
.hello p{margin:4px 0 0;color:var(--muted)}

/* next workout — the "bib" */
.bib{background:var(--navy);color:#fff;border-radius:18px;padding:18px;position:relative;overflow:hidden}
.bib::before,.bib::after{content:"";position:absolute;top:14px;width:9px;height:9px;border-radius:50%;background:var(--bg)}
.bib::before{left:12px}.bib::after{right:12px}
.bib .eyebrow{color:#9FB0C8;padding-left:14px}
.bib h2{font-size:2.1rem;margin-top:10px}
.bib p{color:#C9D3E2;margin:6px 0 14px}
.bib .bib-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bib .tag{background:rgba(255,255,255,.1)}
.bib .btn-primary{margin-left:auto}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.kpi b{display:block;font:700 1.7rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi span{font-size:.75rem;color:var(--muted);font-weight:600}

.tag{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:4px 9px;background:var(--surface-2)}
.tag i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.t-leve{color:var(--t-leve)} .t-intervalado,.t-fartlek,.t-subidas{color:var(--t-quali)} .t-ritmo{color:var(--t-ritmo)}
.t-longao{color:var(--t-long)} .t-regenerativo,.t-ativacao,.t-caminhada{color:var(--t-reg)} .t-prova{color:var(--t-prova)}
.bib .tag{color:#fff}

/* countdown */
.count{display:flex;align-items:center;gap:14px}
.count-n{font:800 3rem/0.9 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:10px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px}

/* list rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r-num{font:700 1.3rem/1 var(--f-display);font-variant-numeric:tabular-nums;text-align:right}
.row .r-num small{font:600 .7rem var(--f-body);color:var(--muted);display:block;margin-top:2px}
.thumb{width:52px;height:52px;border-radius:10px;background:var(--surface-2);flex:none;overflow:hidden;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:100%;height:100%}

/* ---------- plan ---------- */
.plan-sum{display:flex;flex-direction:column;gap:6px}
.plan-sum h2{font-size:1.9rem}
.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.zone{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.zone b{font:700 1.2rem/1 var(--f-display);display:block}
.zone span{font-size:.72rem;color:var(--muted);font-weight:600}
.week{display:flex;flex-direction:column;gap:8px}
.week-h{display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px}
.week-h h3{font-size:1.25rem}
.sess{display:flex;gap:12px;background:var(--surface);border-radius:12px;padding:12px;box-shadow:var(--shadow);align-items:flex-start}
.sess.is-today{outline:2px solid var(--accent)}
.sess.is-done{opacity:.62}
.sess-date{width:44px;flex:none;text-align:center;border-right:1px solid var(--line);padding-right:10px}
.sess-date b{display:block;font:700 1.6rem/1 var(--f-display)}
.sess-date span{font-size:.7rem;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
.sess-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.sess-body h3{font-size:1.15rem}
.sess-body p{margin:0;font-size:.9rem;color:var(--muted)}
.sess-act{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.tick{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center}
.tick svg{width:18px;height:18px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.tick.on{background:var(--good);border-color:var(--good)}
.tick.on svg{opacity:1}

/* ---------- run ---------- */
.view-run{padding:0;gap:0;position:relative;height:calc(100dvh - 58px - env(safe-area-inset-top,0px) - 64px - env(safe-area-inset-bottom,0px));min-height:460px}
.app.running .view-run{height:calc(100dvh - 58px - env(safe-area-inset-top,0px))}
.run-map{flex:1;min-height:200px;background:var(--surface-2);position:relative;z-index:1}
.map-fallback{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);padding:20px;text-align:center}
.map-fallback svg{width:100%;height:100%}
.gps-pill{position:absolute;top:12px;left:12px;z-index:5;background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.8rem;font-weight:600;display:flex;gap:7px;align-items:center;box-shadow:var(--shadow)}
.gps-pill i{width:9px;height:9px;border-radius:50%;background:var(--warn)}
.gps-pill.ok i{background:var(--good)} .gps-pill.bad i{background:var(--bad)}
.run-panel{background:var(--surface);padding-inline:var(--gut);padding-block:16px 18px;border-radius:20px 20px 0 0;margin-top:-18px;z-index:4;position:relative;display:flex;flex-direction:column;gap:12px;box-shadow:0 -8px 24px rgba(0,0,0,.12)}
.run-opts{display:flex;gap:14px;flex-wrap:wrap}
.btn-go{align-self:center;width:128px;height:128px;border-radius:50%;border:0;background:var(--accent);color:#fff;font:800 1.6rem/1 var(--f-display);letter-spacing:.08em;box-shadow:0 0 0 8px rgba(255,90,31,.18),0 10px 30px rgba(255,90,31,.45)}
.btn-go:active{transform:scale(.97)}
.live{background:var(--navy);color:#fff}
.live-main{text-align:center}
.stat-xl b{font:800 5rem/0.9 var(--f-display);letter-spacing:-.01em}
.stat-xl span{font:700 1.3rem var(--f-display);color:var(--accent-2);margin-left:6px}
.live-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat b{display:block;font:700 1.8rem/1 var(--f-display)}
.stat span{font-size:.72rem;color:#9FB0C8;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.live-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.live .btn-ghost{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.2)}
.confirm-bar{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.06);padding:8px 10px;border-radius:12px}
.confirm-bar span{flex:1;font-weight:600}
.leaflet-container{font-family:var(--f-body);background:var(--surface-2)}
.me-dot{background:var(--accent);border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 6px rgba(255,90,31,.25)}

/* ---------- finish / share ---------- */
.fin-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.fin-stats .kpi{box-shadow:none;background:var(--surface-2)}
.card-preview{width:100%;max-width:360px;margin:0 auto;display:block;border-radius:14px;aspect-ratio:4/5;background:var(--surface-2)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 140px}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* ---------- ranking ---------- */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end}
.pod{background:var(--surface);border-radius:14px 14px 6px 6px;padding:12px 8px;text-align:center;box-shadow:var(--shadow);min-width:0}
.pod .pos{font:800 2rem/1 var(--f-display)}
.pod.p1{padding-top:22px;background:var(--navy);color:#fff}
.pod.p1 .pos{color:var(--t-prova)}
.pod .nm{font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .km{font:700 1.3rem var(--f-display)}
.rank-pos{width:30px;font:800 1.3rem/1 var(--f-display);color:var(--muted);text-align:center}
.row.is-me{background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:10px;padding-inline:8px}
.badge-demo{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 5px;margin-left:6px;vertical-align:middle}
.filters{display:flex;flex-direction:column;gap:10px}

/* ---------- charts ---------- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font:600 10px var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .dt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .dt.end{fill:var(--accent)}
.chart .br{fill:var(--accent)}
.chart .br.dim{fill:var(--line)}
.chart .vl{fill:var(--ink);font:700 11px var(--f-display)}

/* ---------- profile ---------- */
.body-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.body-grid .kpi{box-shadow:none;background:var(--surface-2)}
.imc-bar{position:relative;height:10px;border-radius:99px;margin:18px 0 6px;background:linear-gradient(90deg,#5BA7E0 0 14%,#16915A 14% 44%,#E3A008 44% 64%,#D43B2F 64%)}
.imc-bar i{position:absolute;top:-6px;width:4px;height:22px;background:var(--ink);border-radius:2px;transform:translateX(-50%)}
.imc-scale{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted)}

/* ---------- modal / toast ---------- */
.modal{position:fixed;inset:0;z-index:1000;display:flex;align-items:flex-end;justify-content:center}
.modal-back{position:absolute;inset:0;background:rgba(6,10,16,.6)}
.modal-sheet{position:relative;background:var(--bg);width:100%;max-width:640px;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;padding-inline:var(--gut);padding-block:20px calc(20px + env(safe-area-inset-bottom,0px))}
.modal-x{position:absolute;right:12px;top:10px;border:0;background:var(--surface);width:34px;height:34px;border-radius:50%;font-size:1.4rem;line-height:1;z-index:2}
#modal-body{display:flex;flex-direction:column;gap:14px}
.mini-map{height:240px;border-radius:14px;overflow:hidden;background:var(--surface-2)}
.splits{width:100%;border-collapse:collapse;font-size:.92rem}
.splits td,.splits th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.splits th{font-size:.72rem;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
.splits .bar{height:8px;background:var(--accent);border-radius:99px;opacity:.8}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.92rem;opacity:0;pointer-events:none;transition:.25s;z-index:2000;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (min-width:640px){ .kpis{grid-template-columns:repeat(4,1fr)} .body-grid{grid-template-columns:repeat(4,1fr)} }
@media (max-width:380px){ .grid3{grid-template-columns:1fr 1fr} .stat-xl b{font-size:4.2rem} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
.modal[data-lock="1"] .modal-x{display:none}

</style>
</head>
<body>

<!-- ============ LOGIN / CADASTRO ============ -->
<section id="auth" class="auth">
  <div class="auth-hero">
    <div class="logo-lockup">
      <span class="logo-mark" aria-hidden="true"></span>
      <div>
        <div class="logo-word">JOTAK <b>360</b></div>
        <div class="logo-sub">RUNNING</div>
      </div>
    </div>
    <p class="auth-tag">Seu plano até a linha de chegada. GPS, evolução e ranking no mesmo lugar.</p>
  </div>

  <div class="auth-card">
    <div class="seg" role="tablist">
      <button type="button" class="seg-btn is-on" data-auth="login" role="tab">Entrar</button>
      <button type="button" class="seg-btn" data-auth="signup" role="tab">Criar conta</button>
    </div>

    <form id="f-login" class="form" autocomplete="on">
      <label class="fld"><span>E-mail</span><input id="li-email" type="email" required autocomplete="email" placeholder="voce@email.com"></label>
      <label class="fld"><span>Senha</span><input id="li-pass" type="password" required autocomplete="current-password" minlength="4"></label>
      <p class="form-err" id="li-err" hidden></p>
      <button class="btn btn-primary btn-block" type="submit">Entrar</button>
    </form>

    <form id="f-signup" class="form" hidden autocomplete="on">
      <label class="fld"><span>Nome</span><input id="su-name" required autocomplete="name" placeholder="Como quer aparecer no ranking"></label>
      <label class="fld"><span>E-mail</span><input id="su-email" type="email" required autocomplete="email"></label>
      <label class="fld"><span>Senha</span><input id="su-pass" type="password" required minlength="4" autocomplete="new-password"></label>
      <div class="grid2">
        <label class="fld"><span>Sexo</span>
          <select id="su-sex" required><option value="F">Feminino</option><option value="M">Masculino</option></select>
        </label>
        <label class="fld"><span>Nascimento</span><input id="su-birth" type="date" required></label>
      </div>
      <div class="grid3">
        <label class="fld"><span>Peso (kg)</span><input id="su-weight" type="number" step="0.1" min="30" max="250" required inputmode="decimal"></label>
        <label class="fld"><span>Altura (cm)</span><input id="su-height" type="number" step="1" min="120" max="230" required inputmode="numeric"></label>
        <label class="fld"><span>% gordura</span><input id="su-fat" type="number" step="0.1" min="3" max="60" inputmode="decimal" placeholder="opcional"></label>
      </div>
      <p class="form-err" id="su-err" hidden></p>
      <button class="btn btn-primary btn-block" type="submit">Criar conta e começar</button>
    </form>
  </div>
  <p class="auth-foot">Os dados ficam salvos neste aparelho.</p>
</section>

<!-- ============ APP ============ -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="logo-lockup sm">
      <span class="logo-mark" aria-hidden="true"></span>
      <div class="logo-word">JOTAK <b>360</b></div>
    </div>
    <button class="avatar" id="btn-avatar" type="button" aria-label="Abrir perfil"></button>
  </header>

  <main class="views">
    <section class="view" id="v-home"></section>
    <section class="view" id="v-plan" hidden></section>

    <section class="view view-run" id="v-run" hidden>
      <div class="run-map" id="run-map"><div class="map-fallback" id="run-map-fb" hidden></div></div>
      <div class="gps-pill" id="gps-pill"><i></i><span>Procurando GPS…</span></div>

      <div class="run-panel" id="run-pre">
        <label class="fld"><span>Treino</span><select id="run-session"></select></label>
        <div class="run-opts">
          <label class="check"><input type="checkbox" id="run-voice" checked> Aviso por voz a cada km</label>
        </div>
        <button class="btn-go" id="btn-start" type="button"><span>INICIAR</span></button>
        <button class="linkbtn" id="btn-sim" type="button">Sem sinal? Simular percurso (teste)</button>
      </div>

      <div class="run-panel live" id="run-live" hidden>
        <div class="live-main">
          <div class="stat-xl"><b id="lv-dist">0,00</b><span>km</span></div>
        </div>
        <div class="live-row">
          <div class="stat"><b id="lv-time">00:00</b><span>Tempo</span></div>
          <div class="stat"><b id="lv-pace">--:--</b><span>Pace atual</span></div>
          <div class="stat"><b id="lv-avg">--:--</b><span>Pace médio</span></div>
        </div>
        <div class="live-actions">
          <button class="btn btn-ghost" id="btn-pause" type="button">Pausar</button>
          <button class="btn btn-danger" id="btn-finish" type="button">Finalizar</button>
        </div>
        <div class="confirm-bar" id="finish-confirm" hidden>
          <span>Encerrar o treino?</span>
          <button class="btn btn-ghost sm" id="btn-finish-no" type="button">Continuar</button>
          <button class="btn btn-danger sm" id="btn-finish-yes" type="button">Encerrar</button>
        </div>
      </div>
    </section>

    <section class="view" id="v-rank" hidden></section>
    <section class="view" id="v-profile" hidden></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-view="home" class="is-on" type="button"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Início</span></button>
    <button data-view="plan" type="button"><svg viewBox="0 0 24 24"><path d="M7 3v3M17 3v3M4 8h16M5 5h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm3 8 2.5 2.5L16 11"/></svg><span>Plano</span></button>
    <button data-view="run" class="tab-run" type="button"><svg viewBox="0 0 24 24"><path d="M13.5 5.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM9 22l2-6 3 3v3m-8-9 3-4 4 1 2 3 3 1M8 9l-3 1"/></svg><span>Correr</span></button>
    <button data-view="rank" type="button"><svg viewBox="0 0 24 24"><path d="M8 21V11H3v10zm6.5 0V4h-5v17zM21 21v-7h-5v7z"/></svg><span>Ranking</span></button>
    <button data-view="profile" type="button"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm-8 9a8 8 0 0 1 16 0"/></svg><span>Perfil</span></button>
  </nav>
</div>

<!-- ============ MODAL / TOAST ============ -->
<div class="modal" id="modal" hidden>
  <div class="modal-back" data-close></div>
  <div class="modal-sheet" role="dialog" aria-modal="true">
    <button class="modal-x" data-close type="button" aria-label="Fechar">×</button>
    <div id="modal-body"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
'use strict';
/* =========================================================
   Jotak 360 Running — núcleo: utilitários, armazenamento,
   autenticação, navegação, modal, gráficos
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ---------- datas ---------- */
const DAY = 864e5;
const iso = d => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; };
const parseISO = s => { const [y, m, d] = s.slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const today0 = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const daysBetween = (a, b) => Math.round((parseISO(iso(b)) - parseISO(iso(a))) / DAY);
const WD = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
const WD_LONG = ['segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado', 'domingo'];
const MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const wdIdx = d => (d.getDay() + 6) % 7;
const fmtDate = d => `${d.getDate()} ${MES[d.getMonth()]}`;
const fmtDateLong = d => `${WD_LONG[wdIdx(d)]}, ${d.getDate()} de ${MES[d.getMonth()]}`;

/* ---------- números ---------- */
const fmtKm = km => (km || 0).toFixed(2).replace('.', ',');
const fmt1 = n => (n == null || isNaN(n)) ? '–' : (+n).toFixed(1).replace('.', ',');
const fmtDur = s => {
  s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}` : `${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
};
const fmtPace = spk => (!spk || !isFinite(spk) || spk > 1800) ? '--:--' : `${Math.floor(spk / 60)}:${String(Math.round(spk % 60)).padStart(2, '0')}`;
const parseTime = str => { // "mm:ss" ou "h:mm:ss" -> segundos
  if (!str) return null; const p = str.trim().split(':').map(Number); if (p.some(isNaN)) return null;
  return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p.length === 2 ? p[0] * 60 + p[1] : null;
};
function hav(a, b) { // metros
  const R = 6371e3, r = Math.PI / 180;
  const dLat = (b[0] - a[0]) * r, dLng = (b[1] - a[1]) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

/* ---------- armazenamento (localStorage + IndexedDB p/ fotos) ---------- */
const DB_KEY = 'j360.v1';
let DB = (() => { try { return JSON.parse(localStorage.getItem(DB_KEY)) || null; } catch (e) { return null; } })() || { users: {}, session: null, prefs: {} };
DB.prefs = DB.prefs || {};
function save() { try { localStorage.setItem(DB_KEY, JSON.stringify(DB)); } catch (e) { toast('Sem espaço para salvar. Apague treinos antigos.'); } }
const me = () => DB.users[DB.session];

const Photos = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      if (this.db) return res(this.db);
      if (!window.indexedDB) return rej(new Error('sem IndexedDB'));
      const r = indexedDB.open('j360-photos', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('p');
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async put(k, blob) { const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction('p', 'readwrite'); tx.objectStore('p').put(blob, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); },
  async get(k) { try { const db = await this.open(); return await new Promise(res => { const r = db.transaction('p').objectStore('p').get(k); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); }); } catch (e) { return null; } },
  async del(k) { try { const db = await this.open(); db.transaction('p', 'readwrite').objectStore('p').delete(k); } catch (e) { } }
};

/* ---------- autenticação local ---------- */
async function hashPass(pw, salt) {
  const data = new TextEncoder().encode(salt + ':' + pw);
  if (window.crypto && crypto.subtle) {
    const h = await crypto.subtle.digest('SHA-256', data);
    return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  let h = 2166136261; for (const b of data) { h ^= b; h = Math.imul(h, 16777619) >>> 0; } return 'f' + h.toString(16);
}
const findByEmail = email => Object.values(DB.users).find(u => u.email === email.trim().toLowerCase());

async function signup(f) {
  const email = f.email.trim().toLowerCase();
  if (findByEmail(email)) throw new Error('Este e-mail já tem conta. Use "Entrar".');

    id: uid(), name: f.name.trim(), email, salt, pass: await hashPass(f.pass, salt),
    sex: f.sex, birth: f.birth, height: +f.height, createdAt: new Date().toISOString(),
    measures: [{ date: iso(new Date()), weight: +f.weight, fat: f.fat ? +f.fat : null }],

  DB.session = u.id; save(); return u;
}

function lineChart(pts, { w = 340, h = 160, fmt = v => fmt1(v), unit = '' } = {}) {
  if (!pts.length) return '<p class="empty small">Sem dados ainda.</p>';
  const pad = { l: 34, r: 14, t: 16, b: 24 };
  const ys = pts.map(p => p.y); let min = Math.min(...ys), max = Math.max(...ys);
  if (max - min < 1) { min -= 1; max += 1; } const span = max - min; min -= span * .15; max += span * .15;
  const X = i => pad.l + (pts.length === 1 ? (w - pad.l - pad.r) / 2 : i * (w - pad.l - pad.r) / (pts.length - 1));
  const Y = v => pad.t + (1 - (v - min) / (max - min)) * (h - pad.t - pad.b);
  const ticks = [0, .5, 1].map(f => min + (max - min) * f);
  let s = `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">`;
  ticks.forEach(v => { s += `<line class="grid" x1="${pad.l}" x2="${w - pad.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pad.l - 6}" y="${Y(v) + 3}" text-anchor="end">${fmt(v)}</text>`; });
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  if (pts.length > 1) s += `<path class="ar" d="${d}L${X(pts.length - 1)},${h - pad.b}L${X(0)},${h - pad.b}Z"/><path class="ln" d="${d}"/>`;
  const step = Math.ceil(pts.length / 6);
  pts.forEach((p, i) => {
    const end = i === pts.length - 1;
    s += `<circle class="dt${end ? ' end' : ''}" cx="${X(i)}" cy="${Y(p.y)}" r="${end ? 5 : 3.5}"/>`;
    if (i % step === 0 || end) s += `<text x="${X(i)}" y="${h - 6}" text-anchor="middle">${esc(p.x)}</text>`;
  });
  const lp = pts[pts.length - 1];
  s += `<text class="vl" x="${Math.min(X(pts.length - 1), w - pad.r)}" y="${Y(lp.y) - 10}" text-anchor="end">${fmt(lp.y)}${unit}</text>`;
  return s + '</svg>';
}
function barChart(bars, { w = 340, h = 140 } = {}) {
  const pad = { l: 8, r: 8, t: 18, b: 22 }; const max = Math.max(1, ...bars.map(b => b.y));
  const bw = (w - pad.l - pad.r) / bars.length;
  let s = `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img"><line class="grid" x1="${pad.l}" x2="${w - pad.r}" y1="${h - pad.b}" y2="${h - pad.b}"/>`;
  bars.forEach((b, i) => {
    const bh = (b.y / max) * (h - pad.t - pad.b), x = pad.l + i * bw + bw * .18, last = i === bars.length - 1;
    s += `<rect class="br${last ? '' : ' dim'}" x="${x}" y="${h - pad.b - bh}" width="${bw * .64}" height="${Math.max(bh, b.y ? 2 : 0)}" rx="3"/>`;
    if (b.y) s += `<text class="vl" x="${x + bw * .32}" y="${h - pad.b - bh - 4}" text-anchor="middle">${fmt1(b.y)}</text>`;
    s += `<text x="${x + bw * .32}" y="${h - 6}" text-anchor="middle">${esc(b.x)}</text>`;
  });
  return s + '</svg>';
}
/* percurso desenhado sem mapa (miniaturas / sem internet) */
function routeSVG(pts, { w = 100, h = 100, pad = 10, stroke = 'var(--accent)', sw = 4 } = {}) {
  if (!pts || pts.length < 2) return `<svg viewBox="0 0 ${w} ${h}"><circle cx="${w / 2}" cy="${h / 2}" r="6" fill="${stroke}"/></svg>`;
  const P = projector(pts, w, h, pad);
  const d = pts.map((p, i) => `${i && !p[4] ? 'L' : 'M'}${P(p).map(v => v.toFixed(1)).join(',')}`).join('');
  const a = P(pts[0]), b = P(pts[pts.length - 1]);
  return `<svg viewBox="0 0 ${w} ${h}"><path d="${d}" fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${a[0]}" cy="${a[1]}" r="${sw}" fill="var(--good)"/><circle cx="${b[0]}" cy="${b[1]}" r="${sw}" fill="var(--ink)"/></svg>`;
}
function projector(pts, w, h, pad) {
  const lat0 = pts.reduce((s, p) => s + p[0], 0) / pts.length, k = Math.cos(lat0 * Math.PI / 180);
  const xs = pts.map(p => p[1] * k), ys = pts.map(p => -p[0]);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const sc = Math.min((w - 2 * pad) / ((maxX - minX) || 1e-9), (h - 2 * pad) / ((maxY - minY) || 1e-9));
  const ox = (w - (maxX - minX) * sc) / 2, oy = (h - (maxY - minY) * sc) / 2;
  return p => [ox + (p[1] * k - minX) * sc, oy + (-p[0] - minY) * sc];
}

'use strict';
/* =========================================================
   Gerador de plano de treino — 5 / 10 / 21 km
   Níveis: iniciante, intermediário, avançado
   Dias por semana: escolhidos pelo atleta (2 a 6)
   O plano é datado do dia de hoje até o dia da prova.
   ========================================================= */
const DIST_NAME = { 5: '5 km', 10: '10 km', 21: 'Meia maratona 21 km' };
const LEVEL_NAME = { ini: 'Iniciante', int: 'Intermediário', adv: 'Avançado' };
const TYPE_NAME = {
  leve: 'Rodagem leve', intervalado: 'Intervalado', fartlek: 'Fartlek', subidas: 'Subidas', ritmo: 'Ritmo de prova',
  longao: 'Longão', regenerativo: 'Regenerativo', ativacao: 'Ativação', caminhada: 'Corrida + caminhada', prova: 'Dia da prova'
};
// longão inicial e de pico (km)
const LONG_BASE = { 5: { ini: 2, int: 4, adv: 6 }, 10: { ini: 4, int: 6, adv: 8 }, 21: { ini: 7, int: 10, adv: 12 } };
const LONG_PEAK = { 5: { ini: 5, int: 7, adv: 9 }, 10: { ini: 9, int: 12, adv: 15 }, 21: { ini: 16, int: 18, adv: 20 } };
const half = v => Math.max(1, Math.round(v * 2) / 2);

// Estrutura da semana conforme o número de dias escolhidos (o último é o longão)
const WEEK_SHAPE = {
  1: ['longao'],
  2: ['Q', 'longao'],
  3: ['leve', 'Q', 'longao'],
  4: ['leve', 'Q', 'leve', 'longao'],
  5: ['leve', 'Q', 'regenerativo', 'ritmo', 'longao'],
  6: ['leve', 'Q', 'regenerativo', 'ritmo', 'leve', 'longao']
};

function qualitySession(level, dist, w, prog) {
  const kind = ['intervalado', 'fartlek', 'subidas'][w % 3];
  if (level === 'ini') {
    const run = Math.min(8, 1 + Math.round(prog * 6)), walk = run >= 5 ? 1 : 2, reps = Math.max(4, Math.round(30 / (run + walk)));
    return { type: 'caminhada', detail: `Aqueça 5' caminhando. ${reps}x (${run}' correndo leve + ${walk}' caminhando). Desaqueça 5' caminhando.`, min: reps * (run + walk) + 10 };
  }
  if (kind === 'intervalado') {
    if (level === 'int') { const n = 5 + Math.round(prog * 4); const rep = dist === 21 ? '800 m' : '400 m';
      return { type: 'intervalado', detail: `Aqueça 10' leve. ${n}x ${rep} forte (ritmo de 5 km) com 1'30" de trote. Desaqueça 10'.`, min: 20 + n * 4 }; }
    const n = 4 + Math.round(prog * 3); const rep = dist === 5 ? '600 m' : '1000 m';
    return { type: 'intervalado', detail: `Aqueça 15'. ${n}x ${rep} no ritmo forte (5–10 km) com 2' de trote. Desaqueça 10'.`, min: 25 + n * 6 };
  }
  if (kind === 'fartlek') {
    const m = (level === 'int' ? 20 : 28) + Math.round(prog * 10);
    return { type: 'fartlek', detail: `Aqueça 10'. ${m}' alternando 1' forte / 1' leve (sem parar). Desaqueça 5'.`, min: m + 15 };
  }
  const n = (level === 'int' ? 6 : 8) + Math.round(prog * 3);
  return { type: 'subidas', detail: `Aqueça 10'. ${n}x subida de 60–90" forte, descida trotando. Desaqueça 10'. Fortalece e melhora a passada.`, min: 20 + n * 3 };
}

function generatePlan({ dist, level, days, raceDate, raceName, target }) {
  const start = today0(), race = parseISO(raceDate);
  const firstMon = mondayOf(start), raceMon = mondayOf(race);
  const weeks = Math.round((raceMon - firstMon) / (7 * DAY)) + 1;
  const dd = [...days].sort((a, b) => a - b);
  const shape = WEEK_SHAPE[Math.min(6, dd.length)];
  const base = LONG_BASE[dist][level], peak = LONG_PEAK[dist][level];
  const buildWeeks = Math.max(1, weeks - 1);
  const peakWeek = buildWeeks >= 4 ? buildWeeks - 2 : buildWeeks - 1; // com 4+ semanas, a última antes da prova já alivia
  const sessions = [];

  for (let w = 0; w < weeks; w++) {
    const raceWeek = w === weeks - 1;
    const prog = peakWeek <= 0 ? 1 : Math.min(1, w / peakWeek);
    let long = base + (peak - base) * prog;
    if (!raceWeek && w > peakWeek) long *= 0.75;            // polimento
    else if (!raceWeek && (w + 1) % 4 === 0 && w < peakWeek) long *= 0.8; // semana de recuperação
    long = half(long);
    const easy = half(Math.max(level === 'ini' ? 2 : 3, long * (level === 'adv' ? 0.6 : 0.5)));

    // datas deste bloco semanal
    const slots = dd.map(d => addDays(firstMon, w * 7 + d)).filter(dt => dt >= start && (!raceWeek || dt < race));
    // descarta do início quando a semana começou pela metade (mantém longão no fim)
    const shapeW = raceWeek ? null : shape.slice(shape.length - Math.min(shape.length, slots.length));

    slots.forEach((dt, i) => {
      let s;
      if (raceWeek) {
        const isLastSlot = i === slots.length - 1;
        if (isLastSlot && daysBetween(dt, race) <= 2) s = { type: 'ativacao', title: TYPE_NAME.ativacao, detail: `15–20' bem leve + 4 acelerações de 20". Guarde energia para a prova.`, km: 2.5 };
        else s = { type: 'leve', title: 'Rodagem de soltura', detail: `${half(easy * 0.7)} km leve. Semana de prova: menos volume, pernas descansadas.`, km: half(easy * 0.7) };
      } else {
        const kind = shapeW[i] || 'leve';
        if (kind === 'Q') { const q = qualitySession(level, dist, w, prog); s = { type: q.type, title: TYPE_NAME[q.type], detail: q.detail, km: half(easy * 1.1) }; }
        else if (kind === 'longao') s = { type: 'longao', title: `${TYPE_NAME.longao} ${fmt1(long).replace(',0', '')} km`, detail: `${fmt1(long).replace(',0', '')} km em ritmo leve e constante — dá para conversar.${level === 'ini' ? ' Se precisar, caminhe 1\' a cada 10\'.' : ''}${dist === 21 && long >= 14 ? ' Treine a hidratação/gel que vai usar na prova.' : ''}`, km: long };
        else if (kind === 'ritmo') { const rp = half(Math.min(dist === 21 ? 8 : dist, easy * 0.6)); s = { type: 'ritmo', title: TYPE_NAME.ritmo, detail: `2 km leve + ${fmt1(rp).replace(',0', '')} km no ritmo alvo da prova + 1 km leve.`, km: half(rp + 3) }; }
        else if (kind === 'regenerativo') s = { type: 'regenerativo', title: TYPE_NAME.regenerativo, detail: `${half(easy * 0.6)} km bem leve (ou 30' de caminhada) + 10' de alongamento.`, km: half(easy * 0.6) };
        else s = { type: 'leve', title: TYPE_NAME.leve, detail: `${fmt1(easy).replace(',0', '')} km leve, respiração confortável (zona 2).`, km: easy };
      }
      sessions.push({ id: uid(), date: iso(dt), week: w + 1, done: false, runId: null, ...s });
    });
  }
  sessions.push({ id: uid(), date: iso(race), week: weeks, done: false, runId: null, type: 'prova', title: raceName ? raceName : `Prova ${DIST_NAME[dist]}`,
    detail: `Largue controlado, acelere na segunda metade. Distância: ${dist === 21 ? '21,1' : dist} km.`, km: dist === 21 ? 21.1 : dist });

  const tsec = parseTime(target); const rp = tsec ? tsec / (dist === 21 ? 21.0975 : dist) : null;
  return { id: uid(), dist, level, days: dd, raceDate, raceName: raceName || '', target: target || '', racePace: rp, weeks, createdAt: new Date().toISOString(), sessions };
}

'use strict';
/* =========================================================
   Treino ao vivo: GPS, mapa, pace, parciais por km, voz,
   finalização com selfie + cartão para compartilhar
   ========================================================= */
const HAS_LEAFLET = () => typeof L !== 'undefined';
const TILE_URL = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
const TILE_ATTR = '&copy; OpenStreetMap';
const DEFAULT_CENTER = [-23.5874, -46.6576]; // usado só até o GPS responder

const Run = {
  state: 'idle',  // idle | running | paused | done
  pts: [],        // [lat, lng, tSeg, distAcumM, inicioDeSegmento?]
  dist: 0, acc: 0, segStart: 0, splits: [], sessionId: null, startedAt: null,
  watchId: null, timer: null, sim: null, wake: null, newSeg: false, lastFix: null, follow: true
};
let runMap = null, runLine = null, meMarker = null;

function elapsed() { return Run.acc + (Run.state === 'running' ? (Date.now() - Run.segStart) / 1000 : 0); }

function enterRun(opts = {}) {
  const u = me();
  if (Run.state === 'idle') {
    const sel = $('#run-session'), t = iso(new Date());
    const opts2 = (u.plan ? u.plan.sessions.filter(s => !s.done && s.date >= iso(addDays(new Date(), -3))).slice(0, 8) : []);
    sel.innerHTML = `<option value="">Treino livre</option>` + opts2.map(s => `<option value="${s.id}">${s.date === t ? 'Hoje · ' : fmtDate(parseISO(s.date)) + ' · '}${esc(s.title)}</option>`).join('');
    const pre = opts.sessionId || (opts2.find(s => s.date === t) || {}).id || '';
    sel.value = pre;
    $('#run-pre').hidden = false; $('#run-live').hidden = true;
  }
  initRunMap();
  startWatch();
}

function initRunMap() {
  if (!HAS_LEAFLET()) { $('#run-map-fb').hidden = false; drawFallbackRoute(); return; }
  if (!runMap) {
    runMap = L.map('run-map', { zoomControl: false, attributionControl: true }).setView(Run.lastFix || DEFAULT_CENTER, Run.lastFix ? 16 : 12);
    L.tileLayer(TILE_URL, { maxZoom: 19, attribution: TILE_ATTR }).addTo(runMap);
    runLine = L.polyline([], { color: '#FF5A1F', weight: 6, opacity: .95, lineJoin: 'round' }).addTo(runMap);
    runMap.on('dragstart', () => { Run.follow = false; });
  }
  setTimeout(() => runMap.invalidateSize(), 60);
}

function gpsStatus(acc, err) {
  const p = $('#gps-pill');
  if (err) { p.className = 'gps-pill bad'; p.querySelector('span').textContent = err; return; }
  p.className = 'gps-pill ' + (acc <= 20 ? 'ok' : acc <= 40 ? '' : 'bad');
  p.querySelector('span').textContent = Run.sim ? 'Simulação' : `GPS ±${Math.round(acc)} m`;
}

function startWatch() {
  if (Run.watchId != null || Run.sim) return;
  if (!('geolocation' in navigator)) { gpsStatus(0, 'Aparelho sem GPS'); return; }
  Run.watchId = navigator.geolocation.watchPosition(onPos, e => {
    gpsStatus(0, e.code === 1 ? 'GPS bloqueado' : 'Sem sinal de GPS');
    if (e.code === 1) toast(window.J360_PREVIEW ? 'Nesta prévia o GPS é bloqueado: use "Simular percurso".' : 'Ative a permissão de localização para registrar o percurso.');
  }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
}
function stopWatch() { if (Run.watchId != null) navigator.geolocation.clearWatch(Run.watchId); Run.watchId = null; }

function onPos(p) {
  const { latitude: lat, longitude: lng, accuracy } = p.coords, ll = [lat, lng];
  Run.lastFix = ll; gpsStatus(accuracy);
  if (runMap) {
    if (!meMarker) meMarker = L.marker(ll, { icon: L.divIcon({ className: 'me-dot', iconSize: [18, 18] }) }).addTo(runMap);
    else meMarker.setLatLng(ll);
    if (Run.state === 'idle' && !onPos._centered) { runMap.setView(ll, 16); onPos._centered = true; }
    if (Run.state === 'running' && Run.follow) runMap.panTo(ll, { animate: true });
  }
  if (Run.state !== 'running' || accuracy > 40) return;
  const t = elapsed(), last = Run.pts[Run.pts.length - 1];
  if (last && !Run.newSeg) {
    const d = hav(last, ll); if (d < 4) return;                 // ruído parado
    const dt = t - last[2]; if (dt > 0 && d / dt > 11) return;  // salto impossível (> 40 km/h)
    Run.dist += d;
  }
  Run.pts.push([+lat.toFixed(6), +lng.toFixed(6), +t.toFixed(1), Math.round(Run.dist), Run.newSeg && last ? 1 : 0]);
  Run.newSeg = false;
  if (runLine) runLine.addLatLng(ll); else drawFallbackRoute();
  checkSplit(t);
}

function drawFallbackRoute() {
  const fb = $('#run-map-fb'); if (!fb || HAS_LEAFLET()) return;
  fb.innerHTML = Run.pts.length > 1 ? routeSVG(Run.pts, { w: 300, h: 300, pad: 24, sw: 5 })
    : '<p>O percurso aparece aqui assim que você começar a se mover.</p>';
}
function checkSplit(t) {
  while (Run.dist >= (Run.splits.length + 1) * 1000) {
    const prev = Run.splits.length ? Run.splits[Run.splits.length - 1].t : 0;
    Run.splits.push({ km: Run.splits.length + 1, t: +t.toFixed(1), pace: t - prev });
    if ($('#run-voice').checked && 'speechSynthesis' in window) {
      const pc = t - prev, msg = new SpeechSynthesisUtterance(`Quilômetro ${Run.splits.length}. Tempo ${Math.floor(t / 60)} minutos. Ritmo ${Math.floor(pc / 60)} e ${Math.round(pc % 60)}.`);
      msg.lang = 'pt-BR'; speechSynthesis.speak(msg);
    }
  }
}

function currentPace() {
  const t = elapsed(), pts = Run.pts; if (pts.length < 2) return null;
  const last = pts[pts.length - 1]; let i = pts.length - 2;
  while (i > 0 && last[2] - pts[i][2] < 30) i--;
  const dd = last[3] - pts[i][3], dt = last[2] - pts[i][2];
  if (dd < 15 || t - last[2] > 20) return null;
  return dt / (dd / 1000);
}

function tick() {
  const t = elapsed(), km = Run.dist / 1000;
  $('#lv-dist').textContent = fmtKm(km);
  $('#lv-time').textContent = fmtDur(t);
  $('#lv-pace').textContent = fmtPace(currentPace());
  $('#lv-avg').textContent = km > 0.05 ? fmtPace(t / km) : '--:--';
}

async function lockScreen() { try { if ('wakeLock' in navigator) Run.wake = await navigator.wakeLock.request('screen'); } catch (e) { } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Run.state === 'running') lockScreen(); });

function startRun() {
  Object.assign(Run, { state: 'running', pts: [], dist: 0, acc: 0, segStart: Date.now(), splits: [], startedAt: new Date().toISOString(), sessionId: $('#run-session').value || null, follow: true, newSeg: false });
  if (runLine) runLine.setLatLngs([]);
  $('#app').classList.add('running'); $('#run-pre').hidden = true; $('#run-live').hidden = false; $('#finish-confirm').hidden = true;
  $('#btn-pause').textContent = 'Pausar';
  Run.timer = setInterval(tick, 1000); tick(); lockScreen();
  if (Run.lastFix) onPos({ coords: { latitude: Run.lastFix[0], longitude: Run.lastFix[1], accuracy: 10 } });
  setTimeout(() => runMap && runMap.invalidateSize(), 80);
}
function togglePause() {
  if (Run.state === 'running') { Run.acc = elapsed(); Run.state = 'paused'; $('#btn-pause').textContent = 'Retomar'; }
  else if (Run.state === 'paused') { Run.segStart = Date.now(); Run.state = 'running'; Run.newSeg = true; Run.follow = true; $('#btn-pause').textContent = 'Pausar'; }

}
function endRun() {
  if (Run.state === 'running') Run.acc = elapsed();

  try { Run.wake && Run.wake.release(); } catch (e) { }
  const u = me(), km = Run.dist / 1000, lm = lastMeasure(u);
  const sess = u.plan && Run.sessionId ? u.plan.sessions.find(s => s.id === Run.sessionId) : null;
  let pts = Run.pts; if (pts.length > 1500) { const k = Math.ceil(pts.length / 1500); pts = pts.filter((p, i) => i % k === 0 || i === pts.length - 1 || p[4]); }
  const run = {
    id: uid(), date: Run.startedAt, dur: Math.round(Run.acc), dist: +km.toFixed(3), pace: km > 0.05 ? Run.acc / km : null,
    kcal: Math.round((lm.weight || 70) * km * 1.036), pts, splits: Run.splits, sessionId: sess ? sess.id : null,
    title: sess ? sess.title : 'Treino livre', type: sess ? sess.type : 'livre', feel: null, hasPhoto: false, note: ''
  };

function resetRun() {
  Object.assign(Run, { state: 'idle', pts: [], dist: 0, acc: 0, splits: [], sessionId: null });
  $('#app').classList.remove('running'); if (runLine) runLine.setLatLngs([]); drawFallbackRoute();
  $('#run-pre').hidden = false; $('#run-live').hidden = true; onPos._centered = false;
}

/* ---------- simulação (testar sem sair de casa) ---------- */
function startSim() {
  stopWatch();
  const c = Run.lastFix || DEFAULT_CENTER; let ang = 0; const R = 350; // m
  const mLat = 1 / 111320, mLng = 1 / (111320 * Math.cos(c[0] * Math.PI / 180));
  Run.sim = setInterval(() => {
    ang += 3.1 / R; // ~3,1 m/s ≈ 5:23/km
    const wob = Math.sin(ang * 5) * 25;
    onPos({ coords: { latitude: c[0] + (R + wob) * Math.sin(ang) * mLat, longitude: c[1] + (R + wob) * (Math.cos(ang) - 1) * mLng, accuracy: 6 } });
  }, 1000);
  $('#btn-sim').textContent = 'Simulação ativa (GPS de teste)'; gpsStatus(6);
}
function stopSim() { if (Run.sim) clearInterval(Run.sim); Run.sim = null; $('#btn-sim').textContent = 'Sem sinal? Simular percurso (teste)'; }

$('#btn-start').onclick = () => { if (!Run.lastFix && !Run.sim) toast('Aguardando sinal de GPS… o percurso começa assim que ele chegar.'); startRun(); };
$('#btn-sim').onclick = () => Run.sim ? (stopSim(), startWatch()) : startSim();
$('#btn-pause').onclick = togglePause;
$('#btn-finish').onclick = () => { $('#finish-confirm').hidden = false; };
$('#btn-finish-no').onclick = () => { $('#finish-confirm').hidden = true; };

function compressImage(file, max = 1400) {
  return new Promise(res => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => res(b || file), 'image/jpeg', 0.85);
    };
    img.onerror = () => res(file); img.src = url;
  });
}

async function drawShareCard(cv, run, photoBlob) {
  try { await document.fonts.ready; } catch (e) { }
  const g = cv.getContext('2d'), W = cv.width, H = cv.height, img = await loadImg(photoBlob);
  const D = '"Barlow Condensed", "Arial Narrow", Arial, sans-serif';

  if (img) {
    const s = Math.max(W / img.width, H / img.height), iw = img.width * s, ih = img.height * s;
    g.drawImage(img, (W - iw) / 2, (H - ih) / 2, iw, ih);
  } else {
    const bg = g.createLinearGradient(0, 0, W, H); bg.addColorStop(0, '#1B2A44'); bg.addColorStop(1, '#0E1726'); g.fillStyle = bg; g.fillRect(0, 0, W, H);
    g.strokeStyle = 'rgba(255,90,31,.12)'; g.lineWidth = 60; g.beginPath(); g.arc(W * .82, H * .2, 260, 0, Math.PI * 1.6); g.stroke();
  }
  const sh = g.createLinearGradient(0, H * .38, 0, H); sh.addColorStop(0, 'rgba(8,12,20,0)'); sh.addColorStop(1, 'rgba(8,12,20,.92)');
  g.fillStyle = sh; g.fillRect(0, 0, W, H);
  const top = g.createLinearGradient(0, 0, 0, 220); top.addColorStop(0, 'rgba(8,12,20,.6)'); top.addColorStop(1, 'rgba(8,12,20,0)'); g.fillStyle = top; g.fillRect(0, 0, W, 220);

  // marca
  g.lineWidth = 12; g.strokeStyle = '#FF5A1F'; g.lineCap = 'round'; g.beginPath(); g.arc(98, 98, 36, Math.PI * 1.1, Math.PI * 1.1 + Math.PI * 1.6); g.stroke();
  g.fillStyle = '#fff'; g.font = `800 58px ${D}`; g.textBaseline = 'middle'; g.fillText('JOTAK', 156, 94);
  const jw = g.measureText('JOTAK ').width; g.fillStyle = '#FF5A1F'; g.font = `italic 800 58px ${D}`; g.fillText('360', 156 + jw, 94);
  g.fillStyle = 'rgba(255,255,255,.8)'; g.font = `700 24px ${D}`; g.fillText('R U N N I N G', 158, 138);

  // percurso
  if (run.pts && run.pts.length > 1) {
    const box = { x: W - 420, y: img ? 190 : 260, w: 360, h: 360 };
    const P = projector(run.pts, box.w, box.h, 10);
    const path = () => { g.beginPath(); run.pts.forEach((p, i) => { const [x, y] = P(p); (i && !p[4]) ? g.lineTo(box.x + x, box.y + y) : g.moveTo(box.x + x, box.y + y); }); };
    g.lineJoin = g.lineCap = 'round';
    path(); g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 20; g.stroke();
    path(); g.strokeStyle = '#fff'; g.lineWidth = 14; g.stroke();
    path(); g.strokeStyle = '#FF5A1F'; g.lineWidth = 8; g.stroke();
  }

  g.textBaseline = 'alphabetic'; g.fillStyle = '#fff';
  g.font = `800 250px ${D}`; const kmTxt = fmtKm(run.dist); g.fillText(kmTxt, 70, H - 330);
  const kw = g.measureText(kmTxt).width; g.fillStyle = '#FF8A3D'; g.font = `700 80px ${D}`; g.fillText('km', 70 + kw + 16, H - 330);
  const cols = [['TEMPO', fmtDur(run.dur)], ['PACE /KM', fmtPace(run.pace)], ['KCAL', String(run.kcal)]];
  cols.forEach(([l, v], i) => {

    g.fillStyle = '#fff'; g.font = `700 86px ${D}`; g.fillText(v, x, H - 150);

  g.fillStyle = 'rgba(255,255,255,.75)'; g.font = `600 34px "Barlow", Arial, sans-serif`;
  const d = new Date(run.date); g.fillText(`${run.title} · ${d.getDate()} ${MES[d.getMonth()]} ${d.getFullYear()}`.slice(0, 52), 72, H - 70);
  g.fillStyle = '#FF5A1F'; g.fillRect(0, H - 16, W, 16);
}

    <div class="mini-map" id="det-map"></div>

      ${r.splits.map(s => `<tr><td>${s.km}</td><td class="num">${fmtPace(s.pace)}</td><td><div class="bar" style="width:${30 + 70 * (maxP - s.pace) / ((maxP - minP) || 1)}%"></div></td></tr>`).join('')}</tbody></table></div>` : ''}
    <canvas class="card-preview" id="det-card" width="1080" height="1350"></canvas>

      <button class="btn btn-primary" id="det-share" type="button">Compartilhar</button>

    </div>
    <div class="btnrow"><label class="btn btn-ghost file-btn">${photo ? 'Trocar foto' : 'Adicionar foto'}<input type="file" accept="image/*" id="det-photo"></label>
      <button class="btn btn-ghost" id="det-del" type="button">Apagar treino</button></div>`);
  drawMiniMap('det-map', r.pts);
  const cv = $('#det-card');
  const refreshDl = () => cv.toBlob(b => { if (b && $('#det-dl')) $('#det-dl').href = URL.createObjectURL(b); }, 'image/jpeg', .9);
  await drawShareCard(cv, r, photo); refreshDl();
  $('#det-photo').onchange = async e => { const f = e.target.files[0]; if (!f) return; const b = await compressImage(f); await Photos.put(r.id, b); r.hasPhoto = true; save(); openRunDetail(r.id); };
  $('#det-share').onclick = () => cv.toBlob(async b => {
    const file = new File([b], `jotak360-${iso(new Date(r.date))}.jpg`, { type: 'image/jpeg' });
    const text = `${fmtKm(r.dist)} km em ${fmtDur(r.dur)} (${fmtPace(r.pace)}/km) com o Jotak 360 Running`;
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], text });
      else { $('#det-dl').click(); toast('Imagem salva — é só postar!'); }
    } catch (e) { }
  }, 'image/jpeg', .9);
  let armed = false;
  $('#det-del').onclick = () => {
    if (!armed) { armed = true; $('#det-del').textContent = 'Confirmar exclusão'; $('#det-del').className = 'btn btn-danger'; return; }
    u.runs = u.runs.filter(x => x.id !== r.id); Photos.del(r.id);
    if (u.plan) u.plan.sessions.forEach(s => { if (s.runId === r.id) { s.runId = null; s.done = false; } });
    save(); closeModal(); toast('Treino apagado'); go(current === 'run' ? 'home' : current);
  };
}

function drawMiniMap(elId, pts) {
  const el = document.getElementById(elId); if (!el) return;
  if (!HAS_LEAFLET() || !pts || pts.length < 2) { el.innerHTML = `<div class="map-fallback">${pts && pts.length > 1 ? routeSVG(pts, { w: 300, h: 240, pad: 20 }) : '<p>Sem percurso registrado.</p>'}</div>`; el.style.position = 'relative'; return; }
  const m = L.map(el, { zoomControl: false, attributionControl: true, dragging: true, scrollWheelZoom: false });
  L.tileLayer(TILE_URL, { maxZoom: 19, attribution: TILE_ATTR }).addTo(m);
  const segs = []; pts.forEach(p => { if (!segs.length || p[4]) segs.push([]); segs[segs.length - 1].push([p[0], p[1]]); });
  const line = L.polyline(segs, { color: '#FF5A1F', weight: 5 }).addTo(m);
  L.circleMarker(pts[0], { radius: 7, color: '#fff', weight: 3, fillColor: '#16915A', fillOpacity: 1 }).addTo(m);
  L.circleMarker(pts[pts.length - 1], { radius: 7, color: '#fff', weight: 3, fillColor: '#0E1726', fillOpacity: 1 }).addTo(m);
  setTimeout(() => { m.invalidateSize(); m.fitBounds(line.getBounds(), { padding: [24, 24] }); }, 80);
}

'use strict';

let current = 'home';
function go(view, opts = {}) {
  if (Run.state === 'running' || Run.state === 'paused') view = 'run';
  current = view;
  $$('.view').forEach(s => s.hidden = s.id !== 'v-' + view);
  $$('#tabbar button').forEach(b => b.classList.toggle('is-on', b.dataset.view === view));

  ({ home: renderHome, plan: renderPlan, run: () => enterRun(opts), rank: renderRank, profile: renderProfile })[view]();
}

/* ---------- INÍCIO ---------- */
function weeklyKm(runs, n = 8) {
  const m0 = mondayOf(new Date());
  return Array.from({ length: n }, (_, i) => {
    const a = addDays(m0, -7 * (n - 1 - i)), b = addDays(a, 7);
    const km = runs.filter(r => { const d = new Date(r.date); return d >= a && d < b; }).reduce((s, r) => s + r.dist, 0);
    return { x: `${a.getDate()}/${a.getMonth() + 1}`, y: +km.toFixed(1) };
  });
}
function renderHome() {
  const u = me(), v = $('#v-home'), runs = [...u.runs].sort((a, b) => b.date.localeCompare(a.date));
  const ns = nextSession(u), t = iso(new Date());
  const wk = weeklyKm(u.runs), totalKm = u.runs.reduce((s, r) => s + r.dist, 0);
  const h = new Date().getHours(), hi = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
  let bib;
  if (!u.plan) bib = `<div class="bib"><span class="eyebrow">Comece por aqui</span><h2>Monte seu plano de prova</h2><p>5, 10 ou 21 km · do iniciante ao avançado · 2 a 6 dias por semana.</p><div class="bib-row"><button class="btn btn-primary" data-go="plan" type="button">Criar plano</button></div></div>`;
  else if (ns) {
    const d = parseISO(ns.date), when = ns.date === t ? 'Treino de hoje' : `Próximo treino · ${fmtDateLong(d)}`;
    bib = `<div class="bib"><span class="eyebrow">${when}</span><h2>${esc(ns.title)}</h2><p>${esc(ns.detail)}</p>
      <div class="bib-row"><span class="tag t-${ns.type}"><i></i>${TYPE_NAME[ns.type]}</span><span class="tag">≈ ${fmt1(ns.km)} km</span>
      <button class="btn btn-primary" data-run="${ns.id}" type="button">Correr agora</button></div></div>`;
  } else bib = `<div class="bib"><span class="eyebrow">Plano concluído</span><h2>Missão cumprida</h2><p>Todos os treinos do plano foram feitos. Que tal o próximo desafio?</p><div class="bib-row"><button class="btn btn-primary" data-go="plan" type="button">Ver plano</button></div></div>`;

  const left = u.plan ? daysBetween(new Date(), parseISO(u.plan.raceDate)) : null;
  v.innerHTML = `
    <div class="hello"><h1>${hi}, ${esc(u.name.split(' ')[0])}</h1>
      <p>${u.plan && left >= 0 ? `${left} dias para ${esc(u.plan.raceName || 'a prova de ' + DIST_NAME[u.plan.dist])}` : 'Bora correr?'}</p></div>
    ${bib}
    <div class="kpis">
      <div class="kpi"><b>${fmt1(wk[wk.length - 1].y)}</b><span>km na semana</span></div>
      <div class="kpi"><b>${fmt1(totalKm)}</b><span>km no total</span></div>
      <div class="kpi"><b>${u.runs.length}</b><span>treinos</span></div>
    </div>
    <div class="card"><div class="card-h"><h3>Km por semana</h3><span class="muted small">últimas 8</span></div>${barChart(wk)}</div>
    <div class="card"><div class="card-h"><h3>Últimos treinos</h3><span class="muted small">${catLabel(u)}</span></div>
      <div class="rows">${runs.length ? runs.slice(0, 8).map(runRow).join('') : '<p class="empty">Nenhum treino ainda. Toque em <b>Correr</b> para começar.</p>'}</div></div>`;
  $$('[data-go]', v).forEach(b => b.onclick = () => go(b.dataset.go));
  $$('[data-run]', v).forEach(b => b.onclick = () => go('run', { sessionId: b.dataset.run }));
  $$('[data-openrun]', v).forEach(b => b.onclick = () => openRunDetail(b.dataset.openrun));
  hydrateThumbs(v);
}
function runRow(r) {
  const d = new Date(r.date);
  return `<button class="row" data-openrun="${r.id}" type="button">
    <div class="thumb" data-thumb="${r.hasPhoto ? r.id : ''}">${routeSVG(r.pts, { sw: 5 })}</div>
    <div class="grow"><b>${esc(r.title || 'Treino livre')}</b><span class="muted small">${fmtDate(d)} · ${fmtDur(r.dur)} · ${fmtPace(r.pace)}/km</span></div>
    <div class="r-num">${fmtKm(r.dist)}<small>km</small></div></button>`;
}
async function hydrateThumbs(root) {
  for (const el of $$('[data-thumb]', root)) {
    if (!el.dataset.thumb) continue; const b = await Photos.get(el.dataset.thumb);
    if (b) el.innerHTML = `<img alt="" src="${URL.createObjectURL(b)}">`;
  }
}

let chartMetric = 'weight';

  const bmi = imc(m.weight, u.height), fatKg = m.fat ? m.weight * m.fat / 100 : null, lean = fatKg != null ? m.weight - fatKg : null;
  const series = {
    weight: { n: 'Peso', unit: ' kg', f: x => x.weight },
    imc: { n: 'IMC', unit: '', f: x => imc(x.weight, u.height) },

        <div class="kpi"><b>${u.height || '–'}</b><span>Altura (cm)</span></div>
        <div class="kpi"><b>${fmt1(m.fat)}</b><span>% Gordura</span></div>
        <div class="kpi"><b>${fmt1(lean)}</b><span>Massa magra (kg)</span></div>
        <div class="kpi"><b>${fmt1(fatKg)}</b><span>Massa gorda (kg)</span></div>
        <div class="kpi"><b>${fmt1(m.muscle)}</b><span>Massa muscular (kg)</span></div>
      </div>
      ${bmi ? `<div style="margin-top:14px"><div class="card-h" style="margin:0"><b>IMC ${fmt1(bmi)}</b><span class="small">${imcClass(bmi)}</span></div>
        <div class="imc-bar"><i style="left:${imcPos}%"></i></div><div class="imc-scale"><span>15</span><span>18,5</span><span>25</span><span>30</span><span>40</span></div></div>` : ''}

      <div class="chips" id="pm-metric" style="margin-bottom:10px">${Object.entries(series).map(([k, s]) => `<button type="button" class="chip${k === chartMetric ? ' is-on' : ''}" data-m="${k}">${s.n}</button>`).join('')}</div>
      ${lineChart(pts, { unit: sr.unit })}
    </div>

    <form class="card form" id="f-measure" style="margin-top:0">
      <h3>Nova medição</h3>
      <div class="grid2">
        <label class="fld"><span>Data</span><input id="ms-date" type="date" value="${iso(new Date())}" required></label>
        <label class="fld"><span>Peso (kg)</span><input id="ms-weight" type="number" step="0.1" min="30" max="250" required inputmode="decimal" value="${m.weight || ''}"></label>

    e.preventDefault(); u.name = $('#pb-name').value.trim() || u.name; u.sex = $('#pb-sex').value; u.birth = $('#pb-birth').value; u.height = +$('#pb-height').value || u.height;
    save(); setAvatar(); toast('Dados atualizados'); renderProfile();
  };
  $('#btn-logout').onclick = logout;
}

/* ---------- RANKING ---------- */
const rankF = { period: 'month', sex: 'mine', age: 'mine' };
const DEMO_NAMES = [['Ana Beatriz', 'F', 1994], ['Carlos Lima', 'M', 1988], ['Juliana Rocha', 'F', 1979], ['Rafael Nunes', 'M', 1996], ['Patrícia Alves', 'F', 1990],
  ['Marcos Vinícius', 'M', 1975], ['Fernanda Costa', 'F', 1985], ['Diego Martins', 'M', 2003], ['Luciana Prado', 'F', 1969], ['Roberto Dias', 'M', 1962], ['Camila Freitas', 'F', 1999], ['Thiago Ramos', 'M', 1983]];
function demoAthletes() {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  return DEMO_NAMES.map(([name, sex, y], i) => {
    const runs = []; const perWeek = 2 + Math.floor(rnd() * 4), avg = 4 + rnd() * 7;
    for (let d = 0; d < 90; d++) if (rnd() < perWeek / 7) runs.push({ date: addDays(new Date(), -d).toISOString(), dist: +(avg * (0.6 + rnd() * .8)).toFixed(2) });
    return { id: 'demo' + i, name, sex, birth: `${y}-06-15`, runs, demo: true };
  });
}
function renderRank() {
  const u = me(), v = $('#v-rank'); const showDemo = DB.prefs.demo !== false;
  const sex = rankF.sex === 'mine' ? u.sex : rankF.sex, age = rankF.age === 'mine' ? ageCat(u.birth)[0] : rankF.age;
  const from = rankF.period === 'week' ? mondayOf(new Date()) : rankF.period === 'month' ? new Date(new Date().getFullYear(), new Date().getMonth(), 1) : new Date(0);
  const people = [...Object.values(DB.users), ...(showDemo ? demoAthletes() : [])];
  const list = people.filter(p => (sex === 'all' || p.sex === sex) && (age === 'all' || ageCat(p.birth)[0] === age))
    .map(p => { const rs = p.runs.filter(r => new Date(r.date) >= from); return { p, km: rs.reduce((s, r) => s + r.dist, 0), n: rs.length }; })
    .filter(x => x.km > 0 || x.p.id === u.id).sort((a, b) => b.km - a.km);
  const myPos = list.findIndex(x => x.p.id === u.id) + 1;
  const catTxt = `${sex === 'all' ? 'Todos' : sex === 'F' ? 'Feminino' : 'Masculino'} · ${age === 'all' ? 'todas as idades' : AGE_CATS.find(c => c[0] === age)[1] + ' anos'}`;
  const chip = (k, val, label) => `<button type="button" class="chip${rankF[k] === val ? ' is-on' : ''}" data-k="${k}" data-v="${val}">${label}</button>`;
  const top = list.slice(0, 3);
  const pod = (x, i) => x ? `<div class="pod p${i + 1}"><div class="pos">${i + 1}º</div><div class="nm">${esc(x.p.name.split(' ')[0])}</div><div class="km">${fmt1(x.km)} km</div></div>` : '<div></div>';

  v.innerHTML = `
    <div><span class="eyebrow">Ranking de km</span><h1>${catTxt}</h1>
      <p class="muted" style="margin:4px 0 0">${myPos ? `Você está em <b style="color:var(--accent)">${myPos}º</b> de ${list.length}` : 'Corra para entrar no ranking'} · ${rankF.period === 'week' ? 'esta semana' : rankF.period === 'month' ? 'este mês' : 'desde sempre'}</p></div>
    <div class="card filters">
      <div class="chips">${chip('period', 'week', 'Semana')}${chip('period', 'month', 'Mês')}${chip('period', 'all', 'Geral')}</div>
      <div class="chips">${chip('sex', 'mine', 'Meu sexo')}${chip('sex', 'F', 'Fem.')}${chip('sex', 'M', 'Masc.')}${chip('sex', 'all', 'Todos')}</div>
      <label class="fld"><span>Faixa etária</span><select id="rk-age">
        <option value="mine"${rankF.age === 'mine' ? ' selected' : ''}>Minha categoria (${ageCat(u.birth)[1]})</option>
        <option value="all"${rankF.age === 'all' ? ' selected' : ''}>Todas</option>
        ${AGE_CATS.map(c => `<option value="${c[0]}"${rankF.age === c[0] ? ' selected' : ''}>${c[1]}</option>`).join('')}</select></label>
      <label class="check small"><input type="checkbox" id="rk-demo"${showDemo ? ' checked' : ''}> Mostrar atletas de exemplo</label>
    </div>
    ${top.length >= 3 ? `<div class="podium">${pod(top[1], 1)}${pod(top[0], 0)}${pod(top[2], 2)}</div>` : ''}
    <div class="card"><div class="rows">
      ${list.length ? list.map((x, i) => `<div class="row${x.p.id === u.id ? ' is-me' : ''}">
        <div class="rank-pos">${i + 1}</div>
        <div class="grow"><b>${esc(x.p.name)}${x.p.demo ? '<span class="badge-demo">exemplo</span>' : ''}${x.p.id === u.id ? ' (você)' : ''}</b>
          <span class="muted small">${catLabel(x.p)} · ${x.n} treino${x.n === 1 ? '' : 's'}</span></div>
        <div class="r-num">${fmt1(x.km)}<small>km</small></div></div>`).join('') : '<p class="empty">Ninguém nesta categoria ainda.</p>'}
    </div></div>
    <p class="muted small" style="text-align:center">O ranking reúne os atletas cadastrados neste aparelho${showDemo ? ' e atletas de exemplo' : ''}. Com um servidor (ver LEIAME) ele fica online entre todos.</p>`;
  $$('.filters [data-k]', v).forEach(c => c.onclick = () => { rankF[c.dataset.k] = c.dataset.v; renderRank(); });
  $('#rk-age').onchange = e => { rankF.age = e.target.value; renderRank(); };
  $('#rk-demo').onchange = e => { DB.prefs.demo = e.target.checked; save(); renderRank(); };
}

  try {
    await signup({ name: $('#su-name').value, email: $('#su-email').value, pass: $('#su-pass').value, sex: $('#su-sex').value, birth: $('#su-birth').value, weight: $('#su-weight').value, height: $('#su-height').value, fat: $('#su-fat').value });
    showApp(); toast('Conta criada. Agora monte seu plano!');
  } catch (x) { err.textContent = x.message; err.hidden = false; }
};
$$('#tabbar button').forEach(b => b.onclick = () => go(b.dataset.view));
$('#btn-avatar').onclick = () => go('profile');
if (!Object.keys(DB.users).length) { $$('[data-auth]')[1].click(); }
if (me()) showApp();



</script>
</body>
</html>
